# Tag v1.2.3 on main and a GitHub Release appears with Selby2.app zipped.
# The app is ad-hoc signed (no Apple Developer account), so a downloaded
# copy carries the quarantine flag; the README has the one-line fix.
name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build app
        run: scripts/build.sh
      - name: Zip
        run: ditto -c -k --keepParent build/Selby2.app "Selby2-${GITHUB_REF_NAME}.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Selby2-${GITHUB_REF_NAME}.zip" --title "Selby2 $GITHUB_REF_NAME" --generate-notes
