name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint (strict)
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --strict
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift run selby2-tests
      - name: Panel tests
        run: swift run selby2-ui-tests
      - name: App bundle
        run: |
          scripts/build.sh
          codesign --verify --verbose=2 build/Selby2.app
          plutil -lint build/Selby2.app/Contents/Info.plist
